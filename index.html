<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "src/style.css" />
    <title>Ai Poem Generator</title>
</head>
<body>
    <div class="container">
    <header>
    <h1>AI Poem Generator</h1>
    </header>
    <main>
        <div class="form-container">
        <form id="poem-generator-form">
            <input type="text" 
            placeholder = "Enter the topic of the poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="user-instructions"
            />
            <input type="submit" 
            class="submit-button"
            />
        </form>
            <div class="hint">
            <small>i.e: Nature, Love, Flowers</small>
            </div>
        </div>
        <div class="poem hidden" id="poem"></div>
    </main>
    
    <script src = "src/index.js"></script>
    <footer>
        This project was coded by 
        <a
        href ="https://github.com/Ktabrams" 
        target = "_blank">
        Katherine Abrams</a>
         and is open-sorced on 
        <a 
        href ="https://github.com/Ktabrams/New-Ai-Generator" 
        target="_blank">
        github</a>
        and is hosted on 
        <a href = "https://ka-ai-generator.netlify.app/"
        target="_blank">
        Netlify!
        </a> 
    </footer>
    </div>
</body>
</html>
